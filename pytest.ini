[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# Silence noisy deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning:transformers.*
    ignore::DeprecationWarning:torch.*
    ignore::UserWarning:torch.*
