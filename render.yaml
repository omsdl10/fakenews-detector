services:
  - type: web
    name: fakenews-detector
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.render
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: FakeNews Detector
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: false
      - key: API_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fakenews-detector-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fakenews-detector-cache
          type: keyvalue
          property: connectionString
      - key: CLASSIFIER_MODEL_NAME
        value: roberta-base
      - key: CLASSIFIER_MODEL_PATH
        value: models/fakenews_roberta
      - key: EMBEDDER_MODEL_NAME
        value: sentence-transformers/all-mpnet-base-v2
      - key: DEVICE
        value: cpu
      - key: ALLOWED_ORIGINS
        value: '["https://fakenews-detector.onrender.com"]'
      - key: LOG_JSON
        value: true

  - type: keyvalue
    name: fakenews-detector-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: fakenews-detector-db
    plan: free
